name: Native Windows boundary
on: [push, pull_request]
permissions: {contents: read}
jobs:
  native:
    runs-on: windows-latest
    timeout-minutes: 15
    strategy: {matrix: {python-version: ['3.11','3.12','3.13']}}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with: {python-version: '${{ matrix.python-version }}'}
      - name: Install and run native boundary tests
        shell: pwsh
        run: |
          python -m pip install -e '.[dev]'
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python -m pytest -v -o faulthandler_timeout=60 tests/test_windows_fs.py tests/test_core.py tests/test_audit_boundaries.py tests/test_approvals.py tests/test_web_chat.py tests/test_chat_entrypoint.py tests/test_demo.py tests/test_version.py tests/test_packaging.py
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python examples/e2e_demo.py --auto-approve
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python examples/verify_audit.py
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python -m build
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python -m pip install --force-reinstall (Get-ChildItem dist/*.whl)[0].FullName
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python scripts/chat_smoke.py
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
