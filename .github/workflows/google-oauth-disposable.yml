name: Disposable Google OAuth lifecycle
on: {workflow_dispatch: {inputs: {authorization_code: {description: 'One-time code from disposable account consent', required: true, type: string}}}}
permissions: {contents: read}
jobs:
  lifecycle:
    runs-on: ubuntu-latest
    environment: disposable-google-oauth
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with: {python-version: '3.12'}
      - run: python -m pip install -e .
      - name: Run disposable account lifecycle
        env:
          OPENMUSE_GOOGLE_CLIENT_ID: ${{ secrets.OPENMUSE_GOOGLE_CLIENT_ID }}
          OPENMUSE_GOOGLE_CLIENT_SECRET: ${{ secrets.OPENMUSE_GOOGLE_CLIENT_SECRET }}
          OPENMUSE_GOOGLE_REDIRECT_URI: ${{ vars.OPENMUSE_GOOGLE_REDIRECT_URI }}
          AUTHORIZATION_CODE: ${{ inputs.authorization_code }}
        run: python scripts/google_oauth_live.py --authorization-code "$AUTHORIZATION_CODE"
