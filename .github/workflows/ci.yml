name: CI
on: [push, pull_request]
permissions: {contents: read}
jobs:
  test:
    runs-on: ubuntu-latest
    strategy: {matrix: {python-version: ['3.11','3.12','3.13']}}
    # Linux runners have no OS credential service; the demos opt into an
    # explicit CI key file (0600) as documented in docs/keyed-audit.md.
    env: {OPENMUSE_AUDIT_KEY_FILE: '${{ github.workspace }}/.ci-audit-keys.json'}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with: {python-version: '${{ matrix.python-version }}'}
      - name: Install pinned CI dependencies
        run: |
          version="${{ matrix.python-version }}"
          python -m pip install -c "constraints/py${version//./}.txt" -e '.[dev]'
      - name: Safety boundary regression tests
        run: pytest -q tests/test_audit_boundaries.py tests/test_path_race.py tests/test_subagents.py tests/test_scheduler.py tests/test_bounded_process.py
      - run: ruff check src tests
      - run: mypy src/openmuse
      - run: python scripts/markdown_links.py
      - name: Full suite with hang diagnostics
        timeout-minutes: 5
        env: {COVERAGE_RCFILE: .coveragerc-posix}
        run: pytest -v -o faulthandler_timeout=60 --cov=openmuse --cov-branch --cov-report=term-missing --cov-fail-under=85
      - name: Build and smoke-test installed wheel
        run: |
          python -m build
          python -m venv /tmp/openmuse-wheel-smoke
          /tmp/openmuse-wheel-smoke/bin/pip install dist/*.whl
          /tmp/openmuse-wheel-smoke/bin/openmuse --help
          PATH="/tmp/openmuse-wheel-smoke/bin:$PATH" python scripts/chat_smoke.py
      - run: python examples/e2e_demo.py --auto-approve
      - run: python examples/verify_audit.py
      - run: python -m build
      - run: python -m pip install --force-reinstall dist/*.whl
      - run: python -c "import importlib.metadata, openmuse; assert openmuse.__version__ == importlib.metadata.version('openmuse-agent')"

  container-smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Build reference worker
        run: docker build -f docker/reference-worker/Dockerfile -t openmuse-worker:ci .
      - name: Resolve local image digest for conformance
        run: |
          digest=$(docker image inspect openmuse-worker:ci --format='{{.Id}}')
          python scripts/container_conformance.py "${digest}"

  first-run-rehearsal:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Fresh Docker README-to-first-action rehearsal
        run: |
          docker run --rm -v "$PWD:/source:ro" python:3.12-slim bash -c '
            set -euo pipefail
            started=$SECONDS
            apt-get update -qq && apt-get install -y -qq git >/dev/null
            git config --global --add safe.directory /source/.git
            git clone /source /tmp/openmuse
            cd /tmp/openmuse
            python -m venv .venv
            source .venv/bin/activate
            python -m pip install -e ".[dev]"
            export OPENMUSE_AUDIT_KEY_FILE=/tmp/openmuse/.ci-audit-keys.json
            printf "y\n" | python examples/e2e_demo.py
            python examples/verify_audit.py
            python scripts/chat_smoke.py
            elapsed=$((SECONDS-started))
            echo "README rehearsal: ${elapsed}s (includes Git provisioning and install)"
            test "$elapsed" -lt 900
          '

  windows-wsl-demo:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Install Ubuntu WSL distribution
        shell: pwsh
        run: |
          wsl --install --distribution Ubuntu --web-download --no-launch
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          wsl --list --verbose
      - name: README commands inside WSL
        shell: pwsh
        run: |
          $script = @'
          set -euo pipefail
          apt-get update -qq
          apt-get install -y -qq python3 python3-venv git >/dev/null
          git clone https://github.com/tahodev/openmuse.git /tmp/openmuse
          cd /tmp/openmuse
          git checkout $OPENMUSE_SHA
          python3 -m venv .venv
          source .venv/bin/activate
          python -m pip install -e '.[dev]'
          export OPENMUSE_AUDIT_KEY_FILE=/tmp/openmuse/.ci-audit-keys.json
          printf 'y\n' | python examples/e2e_demo.py
          python examples/verify_audit.py
          python scripts/chat_smoke.py
          '@
          $script | wsl --distribution Ubuntu --user root -- env OPENMUSE_SHA=${{ github.sha }} bash -c "tr -d '\r' | bash"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
