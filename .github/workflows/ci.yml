name: CI
on: [push, pull_request]
permissions: {contents: read}
jobs:
  test:
    runs-on: ubuntu-latest
    strategy: {matrix: {python-version: ['3.11','3.12','3.13']}}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with: {python-version: '${{ matrix.python-version }}'}
      - name: Install pinned CI dependencies
        run: |
          version="${{ matrix.python-version }}"
          python -m pip install -c "constraints/py${version//./}.txt" -e '.[dev]'
      - name: Safety boundary regression tests
        run: pytest -q tests/test_audit_boundaries.py tests/test_path_race.py tests/test_subagents.py tests/test_scheduler.py tests/test_bounded_process.py
      - run: ruff check src tests
      - run: mypy src/openmuse
      - run: python scripts/markdown_links.py
      - run: pytest --cov=openmuse --cov-branch --cov-report=term-missing --cov-fail-under=85
      - name: Build and smoke-test installed wheel
        run: |
          python -m build
          python -m venv /tmp/openmuse-wheel-smoke
          /tmp/openmuse-wheel-smoke/bin/pip install dist/*.whl
          /tmp/openmuse-wheel-smoke/bin/openmuse --help
      - run: python examples/e2e_demo.py --auto-approve
      - run: python examples/verify_audit.py
      - run: python -m build
      - run: python -m pip install --force-reinstall dist/*.whl
      - run: python -c "import importlib.metadata, openmuse; assert openmuse.__version__ == importlib.metadata.version('openmuse-agent')"

  container-smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Build reference worker
        run: docker build -f docker/reference-worker/Dockerfile -t openmuse-worker:ci .
      - name: Resolve local image digest for conformance
        run: |
          digest=$(docker image inspect openmuse-worker:ci --format='{{.Id}}')
          python scripts/container_conformance.py "${digest}"

  first-run-rehearsal:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Fresh Docker README-to-first-action rehearsal
        run: |
          docker run --rm -v "$PWD:/source:ro" python:3.12-slim bash -c '
            set -euo pipefail
            started=$SECONDS
            apt-get update -qq && apt-get install -y -qq git >/dev/null
            git -c safe.directory=/source clone /source /tmp/openmuse
            cd /tmp/openmuse
            python -m venv .venv
            source .venv/bin/activate
            python -m pip install -e ".[dev]"
            printf "y\n" | python examples/e2e_demo.py
            python examples/verify_audit.py
            python scripts/chat_smoke.py
            elapsed=$((SECONDS-started))
            echo "README rehearsal: ${elapsed}s (includes Git provisioning and install)"
            test "$elapsed" -lt 900
          '
