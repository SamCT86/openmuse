name: CI
on: [push, pull_request]
permissions: {contents: read}
jobs:
  test:
    runs-on: ubuntu-latest
    strategy: {matrix: {python-version: ['3.11','3.12','3.13']}}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with: {python-version: '${{ matrix.python-version }}'}
      - run: python -m pip install -e '.[dev]'
      - run: ruff check src tests
      - run: mypy src/openmuse
<<<<<<< ours
      - run: pytest --cov=openmuse --cov-report=term-missing --cov-fail-under=85
      - name: Build and smoke-test installed wheel
        run: |
          python -m build
          python -m venv /tmp/openmuse-wheel-smoke
          /tmp/openmuse-wheel-smoke/bin/pip install dist/*.whl
          /tmp/openmuse-wheel-smoke/bin/openmuse --help
=======
      - run: pytest --cov=openmuse --cov-branch --cov-report=term-missing --cov-fail-under=85
>>>>>>> theirs
      - run: python examples/e2e_demo.py --auto-approve
      - run: python examples/verify_audit.py
      - run: python -m build
      - run: python -m pip install --force-reinstall dist/*.whl
      - run: python -c "import importlib.metadata, openmuse; assert openmuse.__version__ == importlib.metadata.version('openmuse-agent')"

  container-smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Verify Docker isolation flags
        run: |
          docker run --rm --network=none --read-only --cap-drop=ALL --security-opt=no-new-privileges --pids-limit=64 --memory=128m --user=65532:65532 --tmpfs=/tmp:rw,noexec,nosuid,nodev,size=16m python:3.12-alpine python -c 'import os, socket; assert os.getuid() == 65532; socket.socket().connect_ex(("1.1.1.1", 53)) != 0'
