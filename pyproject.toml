[build-system]
requires=["hatchling"]
build-backend="hatchling.build"
[project]
name="openmuse-agent"
version="0.2.0"
description="A local-first, auditable personal AI agent runtime"
readme="README.md"
requires-python=">=3.11"
license="MIT"
authors=[{name="tahodev"}]
keywords=["ai-agent","personal-agent","local-first","automation"]
classifiers=["Development Status :: 3 - Alpha","License :: OSI Approved :: MIT License","Programming Language :: Python :: 3"]
dependencies=["cryptography>=43","keyring>=25"]
[project.optional-dependencies]
dev=["pytest>=8","pytest-cov>=5","ruff>=0.6","mypy>=1.11","build>=1.2"]
[project.scripts]
openmuse="openmuse.cli:main"
[project.urls]
Homepage="https://github.com/tahodev/openmuse"
Issues="https://github.com/tahodev/openmuse/issues"
[tool.hatch.build.targets.wheel]
packages=["src/openmuse"]
[tool.ruff]
line-length=120
[tool.ruff.lint]
ignore=["UP017"]
